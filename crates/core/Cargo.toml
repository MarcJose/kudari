[package]
name = "kudari-core"
description = "The part of Kudari that depends on no user interface and no platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alacritty_terminal.workspace = true
# The engine of the search of alacritty_terminal, to tell patterns that match nothing.
regex-automata = "0.4"
getrandom = "0.4"
polling = "3"
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# What needs no window, measured without KWin or Qt; see the head of the file.
[[bench]]
name = "core"
harness = false

# The allocations of the same frames and cases, with an allocator that counts them.
[[bench]]
name = "allocations"
harness = false

[features]
# Random input for the tests of the front ends, which feed it to their own parsers.
fuzz = []
# Counters of what Kudari does, for the GUI test and the bench; see src/stats.rs.
stats = []
# Lets the GUI test break a terminal on purpose. Never enabled for normal builds.
test-hooks = []

[lints]
workspace = true
