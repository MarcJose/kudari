# Dependency review policy for Kudari, used by .github/workflows/dependency-review.yml: by
# GitHub's dependency review and, in a private repository without GitHub Advanced Security,
# by .github/scripts/sbom-license-check.py.
#
# Kudari is under the MIT licence, and its packages carry the crates it depends on. Those
# come under permissive licences only, as deny.toml demands for cargo-deny as well; copyleft
# licences (GPL, AGPL, LGPL, MPL, EPL, EUPL, SSPL, CDDL, …) are blocked, so that the
# packages stay under permissive terms.
#
# Behaviour of the check:
#   - licence not on the allow list        -> pull request is blocked
#   - invalid licence expression (SPDX)     -> pull request is blocked
#   - no licence detected (NOASSERTION)     -> only reported in the job log – review manually!
#   - vulnerability of "moderate" or higher -> pull request is blocked (GitHub dependency review only;
#                                              otherwise Dependabot alerts report vulnerabilities)
#
# cargo-deny checks the crates against the shorter list in deny.toml as well; a further
# licence goes into both.

fail-on-severity: moderate

# Only dependencies shipped with the product are checked. Build and test tools
# ("development" scope) are not distributed to customers.
fail-on-scopes:
  - runtime

license-check: true

# SPDX identifiers – expressions such as "MIT OR GPL-3.0-only" pass if one option is allowed.
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - Unlicense
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Zlib
  - BSL-1.0
  - CC0-1.0
  - Python-2.0
  - PSF-2.0
  - Unicode-3.0
  - Unicode-DFS-2016
  - BlueOak-1.0.0

# Exceptions: package URL (purl) plus the reason.
# Example:
#   - pkg:cargo/some-crate   # LGPL-2.1, dynamic linking only
allow-dependencies-licenses: []
