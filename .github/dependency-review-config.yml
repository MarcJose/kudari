# Dependency review policy for kudari (used by .github/workflows/dependency-review.yml –
# by GitHub's dependency review and, without GitHub Advanced Security, by the SBOM check).
#
# Marc Jose distributes proprietary B2B software. Only permissive licences are
# allowed; copyleft licences (GPL, AGPL, LGPL, MPL, EPL, EUPL, SSPL, CDDL, …) are
# blocked because they could oblige us to disclose or relicense our own code.
#
# Behaviour of the check:
#   - licence not on the allow list        -> pull request is blocked
#   - invalid licence expression (SPDX)     -> pull request is blocked
#   - no licence detected (NOASSERTION)     -> only reported in the job log – review manually!
#   - vulnerability of "moderate" or higher -> pull request is blocked (GitHub dependency review only;
#                                              otherwise Dependabot alerts report vulnerabilities)
#
# Changes need a code owner approval (.github/CODEOWNERS) – involve legal / OSS
# compliance before allowing further licences or adding exceptions.

fail-on-severity: moderate

# Only dependencies shipped with the product are checked. Build and test tools
# ("development" scope) are not distributed to customers.
fail-on-scopes:
  - runtime

license-check: true

# SPDX identifiers – expressions such as "MIT OR GPL-3.0-only" pass if one option is allowed.
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Zlib
  - BSL-1.0
  - CC0-1.0
  - Python-2.0
  - PSF-2.0
  - Unicode-3.0
  - Unicode-DFS-2016
  - BlueOak-1.0.0

# Approved exceptions: package URL (purl) plus reference to the approval.
# Example:
#   - pkg:npm/some-package   # LGPL-2.1, dynamic linking only – approval LEGAL-123, 2026-10-18
allow-dependencies-licenses: []
