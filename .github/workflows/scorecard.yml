name: Scorecard

# OpenSSF Scorecard rates how the project guards its supply chain: pinned actions, the
# rights of the workflows, the protection of main, signed releases and more. It publishes
# the result for the badge in README.md and shows each finding under code scanning.
# To accept the result for publishing, its service wants this workflow without top-level
# env or defaults and without write rights at the top, and the job of the action on a hosted
# Ubuntu runner without a container, running only actions from its list.
on:
  push:
    branches: [main]
  # The rules of main count towards the score.
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 2"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Upload the findings to code scanning.
      security-events: write
      # Sign the published result, which proves that it comes from this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
