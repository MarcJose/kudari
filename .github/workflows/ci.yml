name: CI

on:
  # Other branches are checked through their pull requests, which would otherwise run every
  # job twice. Tags are left to release.yml, which runs this workflow before it publishes.
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

# A newer push to the same branch makes the running checks pointless.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

# The image is pinned, since its keyring decides which packages pacman trusts. Its packages
# are updated on every run all the same; tools/update-pins.py renews the pin in all workflows.
# The packages Kudari builds against are listed in .github/arch-packages.txt.
#
# The builds keep what Cargo built in a cache, so that mostly Kudari's own crates build again.
# Only runs on main save it, which pull requests then read; a pull request cannot put anything
# into a cache that main or a release would use. A cache belongs to the compiler, the Qt and
# Cargo.lock of its run: code that cxx-qt generates for one version of Qt does not fit another.
# The run of a release, for a tag, builds without any cache.
#
# Cargo takes the crates in third_party/ for changed when their files are newer than what it
# built, as after every checkout, and then builds cxx-qt and all that depends on it again. So
# those files get a fixed old time, and the key of each cache holds their content instead.
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-20261101.0.620205@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          # shellcheck disable=SC2046 # the package list is meant to split
          pacman -S --noconfirm --needed rust vale namcap $(grep -v '^#' .github/arch-packages.txt)
      # The checkout belongs to another user than the container's root, and Vale gets its
      # files from git.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: versions
        run: echo "hash=$({ rustc -V; pacman -Q qt6-base qt6-declarative; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - run: find third_party -type f -exec touch -d 2000-01-01T00:00:00Z {} +
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-
      - run: tests/check.sh
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-${{ hashFiles('Cargo.lock') }}

  # The core is meant for every front end, so it has to build and pass its tests on Windows
  # as well; Unix assumptions show up here before the Windows front end exists.
  core-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - run: cargo +stable clippy --locked --package kudari-core --all-targets -- --deny warnings
      - run: cargo +stable test --locked --package kudari-core

  # The shared Qt parts and the Windows front end, against Qt for MSVC. The smoke test opens
  # the window without a screen, with a ConPTY and the default shell of Windows behind it,
  # once from the build and once from the packages, signed with a throwaway certificate.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QT_VERSION: 6.8.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - id: qt
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-aqt-3.3.0
      - if: steps.qt.outputs.cache-hit != 'true'
        run: python -m pip install aqtinstall==3.3.0
      - if: steps.qt.outputs.cache-hit != 'true'
        run: python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir C:\Qt
        shell: pwsh
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-aqt-3.3.0
      - run: |
          "QMAKE=C:\Qt\$env:QT_VERSION\msvc2022_64\bin\qmake.exe" >> $env:GITHUB_ENV
          "C:\Qt\$env:QT_VERSION\msvc2022_64\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - id: versions
        run: echo "hash=$(rustc +stable -V | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        shell: bash
      - run: find third_party -type f -exec touch -d 2000-01-01T00:00:00Z {} +
        shell: bash
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-qt-${{ env.QT_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-qt-${{ env.QT_VERSION }}-
      - run: cargo +stable clippy --locked --package kudari-qt --package kudari-windows --all-targets -- --deny warnings
      - run: cargo +stable test --locked --package kudari-qt --package kudari-windows
      - run: cargo +stable build --locked --package kudari-windows
      - run: tests/windows/run.sh target/debug/kudari-windows.exe
        shell: bash
      - run: tools/windows-package.ps1 -Out dist
        shell: pwsh
      # Saved before the tests of the packages, which change nothing that Cargo built.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-qt-${{ env.QT_VERSION }}-${{ hashFiles('Cargo.lock') }}
      # The archive brings only the platform of Windows; the test needs the one without a screen.
      - run: |
          mkdir unpacked
          unzip -q dist/kudari-*-x86_64-windows.zip -d unpacked
          cp "C:/Qt/$QT_VERSION/msvc2022_64/plugins/platforms/qoffscreen.dll" unpacked/kudari-*/platforms/
          tests/windows/run.sh unpacked/kudari-*/kudari.exe
        shell: bash
      # The runners of GitHub have a desktop, where UI Automation drives the window.
      - run: tests/windows/gui.ps1 (Resolve-Path unpacked/kudari-*/kudari.exe).Path
        shell: pwsh
      - run: tests/windows/package.ps1 dist
        shell: pwsh

  # Builds and installs as a distribution would, and checks what lands in the package.
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-20261101.0.620205@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          # shellcheck disable=SC2046 # the package list is meant to split
          pacman -S --noconfirm --needed rust cmake make appstream desktop-file-utils $(grep -v '^#' .github/arch-packages.txt)
      - id: versions
        run: echo "hash=$({ rustc -V; pacman -Q qt6-base qt6-declarative; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # CMake has Cargo build into build/cargo.
      - run: find third_party -type f -exec touch -d 2000-01-01T00:00:00Z {} +
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: build-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-
      - run: |
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR="$PWD/package" cmake --install build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: build-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-${{ hashFiles('Cargo.lock') }}
      - run: tools/dist.sh verify package

  # The packages for the AUR, built as an AUR helper would, installed and started: kudari-git
  # from this commit, kudari-bin from the release its PKGBUILD names. Without a cache, as an
  # AUR helper builds.
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-20261101.0.620205@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - run: pacman -Syu --noconfirm --needed git base-devel namcap
      # The whole history with the tags, for the version that kudari-git describes itself with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: tests/aur.sh git
      - run: tests/aur.sh bin

  # The GUI test runs with coverage measured, so it serves for both.
  gui-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # KWin needs a render device, which the runners lack; vgem provides one, and Mesa draws
      # on it in software. The container is started here, as it has to get the device.
      - run: sudo modprobe vgem && ls -l /dev/dri
      # kwin_wayland carries the file capability CAP_SYS_NICE; without it in the container,
      # the kernel refuses to start it at all. The container keeps running for the steps
      # below, and Cargo keeps its downloads in target/, which the cache takes along.
      - run: |
          docker run --detach --name arch --device /dev/dri --cap-add SYS_NICE \
            --volume "$PWD:/src" --workdir /src --env CARGO_HOME=/src/target/cargo-home \
            archlinux:base-20261101.0.620205@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9 \
            sleep infinity
      - run: |
          docker exec arch bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed git kwin dbus qt6-tools rustup cargo-llvm-cov $(grep -v "^#" .github/arch-packages.txt)
            git config --global --add safe.directory /src
            rustup default stable && rustup component add llvm-tools'
      - id: versions
        run: echo "hash=$(docker exec arch sh -c '{ rustc -V; pacman -Q qt6-base qt6-declarative; }' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - run: find third_party -type f -exec touch -d 2000-01-01T00:00:00Z {} +
      - id: cache
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cargo-home/registry
            target/cargo-home/git
            target/coverage
          key: coverage-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: coverage-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-
      # The images of the pixel checks stay in target/gui-images for the artifact below.
      - run: docker exec --env KUDARI_GUI_KEEP=/src/target/gui-images arch bash -euo pipefail -c 'tools/coverage.sh --html --fail-under 90 | tee coverage.txt'
      # The container wrote as root; the steps after it read as the user of the runner.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cargo-home/registry
            target/cargo-home/git
            target/coverage
          key: coverage-${{ steps.versions.outputs.hash }}-${{ hashFiles('third_party/**') }}-${{ hashFiles('Cargo.lock') }}
      - if: always()
        run: |
          {
            echo '### Coverage of the Rust code'
            echo '```'
            sed -n '/^Filename/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-images
          path: target/gui-images
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/coverage/report/html
