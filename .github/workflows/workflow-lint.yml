# Lints and security-audits all GitHub Actions workflows.
# The job names "actionlint" and "zizmor" are required status checks (ruleset "protect-main-develop").
name: workflow-lint

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        # Online audits query github.com; on GHE.com or GHES the token belongs to another host.
        run: |
          offline=()
          [[ $GITHUB_SERVER_URL == https://github.com ]] || offline=(--offline)
          pipx run zizmor==1.30.1 --format=github "${offline[@]}" .
