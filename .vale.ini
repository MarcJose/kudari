#
# Vale checks the English of the documentation and of the comments in the code, with the
# Google developer documentation style (v0.7.2 of github.com/errata-ai/Google, kept in
# .vale/styles/Google so that the check needs no network). tests/check.sh runs it; errors
# fail, warnings show. `vale --minAlertLevel suggestion FILE` shows the suggestions as well.

StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Kudari

[formats]
qml = js

[*.{md,rs,cpp,h,py,qml,ps1}]
BasedOnStyles = Vale, Google
# Where the style of Kudari differs from Google's on purpose: no comma before the last item
# of a list, punctuation outside the quotes unless it belongs to the quote, and capitals
# after a colon for the names that have them.
Google.OxfordComma = NO
Google.Quotes = NO
Google.Colons = NO
# In comments, Vale reads names in backticks as words: the program `kudari` and the D-Bus
# name `io.github.marcjose.kudari.Agent` would need capitals or spaces.
Vale.Terms = NO
Google.Spacing = NO
# The word list fits documentation of web services more than a terminal: "application
# keypad", "one above the other", "a click on it". Its proposals stay suggestions.
Google.WordList = suggestion
Google.WordListCase = suggestion

# The Contributor Covenant, as written by its authors.
[CODE_OF_CONDUCT.md]
BasedOnStyles =
