# The KDE front end is the package at the root; the platform-independent core is a member
# of the workspace. See docs/architecture.md.
[workspace]
members = ["crates/core", "crates/qt", "crates/windows", "crates/console"]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Marc Jose <marc@hahn-jose.de>"]
repository = "https://github.com/MarcJose/kudari"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
alacritty_terminal = "0.26"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-build = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
libc = "0.2"
kudari-core = { path = "crates/core" }
kudari-qt = { path = "crates/qt" }
serde_json = "1.0"

[package]
name = "kudari"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Drop-down terminal for KDE Plasma on Wayland, written in Rust"
documentation = "https://github.com/MarcJose/kudari/wiki"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["linux", "terminal", "console"]
categories = ["utilities", "terminal"]
rust-version.workspace = true
# Built with CMake against Qt and KDE Frameworks, so not for crates.io.
publish = false

[dependencies]
alacritty_terminal.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
cxx-qt-lib-extras = "0.10"
kudari-core.workspace = true
kudari-qt.workspace = true
serde_json.workspace = true
zbus = "6.3"

[dev-dependencies]
kudari-core = { workspace = true, features = ["fuzz"] }

[build-dependencies]
cxx-qt-build.workspace = true

[features]
# Lets automated tests drive the UI over D-Bus. Never enabled for normal builds.
test-hooks = ["kudari-qt/test-hooks"]
# Counters of what Kudari does, written once a second with KUDARI_STATS=1, for the bench.
stats = ["kudari-qt/stats"]

[lints]
workspace = true

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Code must not be able to take the terminals down: see `panic = "abort"` below.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
# Pixel, cell and line numbers fit their types by far; checking each cast adds only noise.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Written for Qt and D-Bus: signatures and flags follow those interfaces.
needless_pass_by_value = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Its `assert_eq!(value, [] as [Type; 0])` reads worse than `assert!(value.is_empty())`, and
# a failing test names its line all the same.
assert_is_empty = "allow"

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false

# Benchmarks build with thin LTO. With the full LTO of the release, what the compiler inlines
# into a function depends on all other code of the benchmark: one more case in it made the
# frames take half as long again, with the frames unchanged.
[profile.bench]
lto = "thin"

# For profiling with perf: the release build with the lines of the code in its symbols, which
# perf report needs to name functions and lines. Never for a release; see CONTRIBUTING.md.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Until cxx-qt publishes them, these crates carry two fixes for reproducible builds and one
# for release builds; see third_party/README.md. Remove the section when a release contains
# all three.
[patch.crates-io]
cxx-qt-build = { path = "third_party/cxx-qt-build" }
qt-build-utils = { path = "third_party/qt-build-utils" }
